<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Fact File</title>
    <style>
        body{
            background-color: pink; 
            font-family: Arial, sans-serif;
        }
        h2{
            color: #ff69b4; /* Hot pink color for the title */
            text-align: center;
            font-size: 50px;
            margin-top: 20px;
        }
        .animal-fact {
            background-color: #f0f8ff; /* Alice blue background */
            border: 10px solid #87bfd2; /* Light blue border */
            border-radius: 10px;
            padding: 20px;
            margin: 20px;
            width: 300px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        p{
            color: #790505; /* Dark gray color for the text */
        }
        .fun-fact {
            font-style: italic;
            color: #ff69b4; /* Hot pink color for the fun fact */
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="animal-fact">
        <h2>Bunny</h2>
        <p>Type: Mammal</p>
        <p>Diet: Herbivore</p>
        <p>Habitat: Grasslands, forests, and meadows</p>
        <p class="fun-fact">Fun Fact: Bunnies have a unique digestive system that allows them to re-digest their food for better nutrient absorption.</p>
    </div>
</body>
</html>
